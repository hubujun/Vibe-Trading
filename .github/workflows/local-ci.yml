name: Local CI (dev/local-work)

# 本地专属 CI — 上游 test.yml 只监听 main, 我们的 dev/local-work 需要回归保障
# 只跑确定性测试 (注入路径, 无网络/无本地数据依赖), 网络类测试留在本地跑
# 注意: 上游同步 (10:00 cron) 不会删除此文件 (上游无同名文件, rebase 保留)

on:
  push:
    branches: [dev/local-work]
  pull_request:
    branches: [dev/local-work]
  workflow_dispatch:

jobs:
  backend-core:
    name: 后端核心回归 (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev,openbb,stats]"
      - name: 核心回归集 (回测/信号/事件/复盘/动态多空比)
        run: |
          pytest agent/tests/test_variant_backtester.py \
                 agent/tests/test_macro_events.py \
                 agent/tests/test_workbench_routes.py \
                 agent/tests/test_review_engine.py \
                 agent/tests/test_dynamic_n.py -q

  frontend-build:
    name: 前端构建 (build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 + 构建
        run: |
          cd frontend
          npm ci
          npm run build
